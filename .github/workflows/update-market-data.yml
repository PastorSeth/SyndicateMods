name: Update market data

on:
  schedule:
    # ==========================================================
    #  >>> HOW OFTEN THIS RUNS — CHANGE THIS ONE LINE <<<
    # ==========================================================
    #  Currently: ONCE A DAY, at 01:00 UTC = 8PM your time (Central).
    #
    #  Times are ALWAYS in UTC — GitHub ignores your local timezone,
    #  and it does NOT adjust for daylight saving. Central Time is
    #  UTC-5 in summer and UTC-6 in winter, so:
    #
    #    '0 1 * * *'  ->  8PM Central in summer, 7PM in winter
    #    '0 2 * * *'  ->  9PM Central in summer, 8PM in winter
    #
    #  It's currently summer, so '0 1 * * *' is set below and you're
    #  getting 8PM on the nose. Come November it'll drift to 7PM. If
    #  that bugs you, switch to '0 2 * * *' then and swap back in March.
    #  Or just leave it — an hour either way doesn't affect the data.
    #
    #  To change how OFTEN it runs instead of when:
    #
    #    Once a day    ->  '0 1 * * *'   (this is what's active now)
    #    Once an hour  ->  '0 * * * *'
    #    Every 6 hours ->  '0 */6 * * *'
    #
    #  Cron format is:  minute  hour  day-of-month  month  day-of-week
    #  An asterisk means "every". So '0 1 * * *' reads as
    #  "at minute 0 of hour 1, every day, every month, every weekday."
    #
    #  Heads up: GitHub's scheduler is best-effort, not exact. A run may
    #  start a few minutes to an hour late when their servers are busy.
    #  That's normal and nothing's broken.
    # ==========================================================
    - cron: '0 1 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest market data
        run: node scripts/update-market-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-data.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update market data"
          git push
